# pr-review-threads.graphql — fetch PR review threads with pagination.
#
# Usage (first page; omit cursor):
#   gh api graphql -F query=@$HOME/.agent/bin/pr-review-threads.graphql \
#     -f owner=OWNER -f repo=REPO -F pr=PR_NUMBER
#
# Next pages: add `-f cursor=<pageInfo.endCursor>` until hasNextPage is false.
# `$cursor` is optional; when omitted it is null and the first page is returned.
# Use -F (not -f) for `query=@file` and for the integer `pr`.
query($owner: String!, $repo: String!, $pr: Int!, $cursor: String) {
  repository(owner: $owner, name: $repo) {
    pullRequest(number: $pr) {
      reviewThreads(first: 100, after: $cursor) {
        pageInfo { hasNextPage endCursor }
        nodes {
          id
          isResolved
          isOutdated
          comments(first: 10) {
            nodes {
              id
              databaseId
              author { login }
              body
              path
              line
              originalLine
              diffHunk
            }
          }
        }
      }
    }
  }
}
