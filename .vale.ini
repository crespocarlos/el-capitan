# The prompt-writing rules a prose linter already expresses (no-shouting, no emoji, off-glossary
# terms); CI runs the pinned Vale over the prompt files in validate.yml. The repo-specific rules stay
# in crew-lint's `style` family. Rules are read as plain text because Cursor's unquoted `globs:`
# frontmatter is not YAML, which Vale's Markdown reader rejects.
StylesPath = .vale/styles
MinAlertLevel = error

[formats]
mdc = txt

[*.{md,mdc}]
BasedOnStyles = Crew
