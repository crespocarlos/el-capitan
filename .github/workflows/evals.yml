name: Reviewer Evals

# Live model calls with a key: run by hand or weekly, never on every pull request (a free-tier rate
# limit or a missing secret failed every PR). The hermetic checks live in validate.yml.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      provider:
        description: "Evaluation provider"
        required: false
        default: "openrouter"
        type: choice
        options: [openrouter, anthropic]
      model:
        description: "OpenRouter model ID"
        required: false
        default: "nvidia/nemotron-3-super-120b-a12b:free"
        type: choice
        options:
          - nvidia/nemotron-3-super-120b-a12b:free
          - z-ai/glm-4.5-air:free
          - google/gemma-4-31b-it:free
          - google/gemma-3-27b-it:free
          - google/gemma-3-12b-it:free
          - google/gemma-3-4b-it:free
          - nousresearch/hermes-3-llama-3.1-405b:free
          - meta-llama/llama-3.2-3b-instruct:free

jobs:
  reviewer-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Run reviewer evals
        working-directory: evals
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Inputs reach the script as data, never spliced into its text.
          INPUT_MODEL: ${{ github.event.inputs.model }}
          INPUT_PROVIDER: ${{ github.event.inputs.provider }}
        run: |
          MODEL="${INPUT_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}"
          PROVIDER="${INPUT_PROVIDER:-openrouter}"
          if [ "$PROVIDER" = anthropic ] && [ -f reviewer/baseline.json ]; then
            MODEL=$(python -c 'import json; print(json.load(open("reviewer/baseline.json"))["model"])')
          fi
          uv run python reviewer/run.py --compare --model "$MODEL"
