name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

# Every check is hermetic: no network beyond the pinned tool downloads, no API key, no model calls.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Repo conventions (routing, catalog, references, prompt budget)
        run: uv run --frozen --managed-python crew-lint.py --budget

      - name: Ruff lint and format (version pinned in ruff.toml)
        run: bash evals/ruff.sh check . && bash evals/ruff.sh format --check .

      - name: Types (basedpyright, pinned in uv.lock; the baseline in .basedpyright only shrinks)
        run: uv run --frozen --managed-python basedpyright

      - name: Spelling in prompts and docs (codespell, pinned)
        run: uvx codespell==2.4.1 rules .cursor .claude/CLAUDE.md AGENTS.md README.md docs CONTRIBUTING.md SECURITY.md CHANGELOG.md .github src/crew/AGENTS.md src/crew/TOOLS.md

      - name: Prompt and doc prose (Vale, pinned; styles in .vale/styles)
        run: uvx --from vale==3.12.0.0 vale rules .cursor/agents .cursor/skills .claude/CLAUDE.md AGENTS.md README.md docs CONTRIBUTING.md SECURITY.md src/crew/AGENTS.md

      - name: Workflow security (zizmor, pinned, offline audits)
        run: uvx zizmor==1.33.1 --offline .github/workflows

      - name: Workflow syntax (actionlint, pinned)
        run: uvx --from actionlint-py==1.7.12.25 actionlint

      - name: Shell syntax
        run: |
          bash -n install.sh
          for f in .claude/hooks/*.sh .claude/hooks/guard/*.sh .claude/hooks/lib/*.sh; do bash -n "$f"; done
          find src/crew -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The upgrade test installs origin/main before this tree, so the full history is needed.
          fetch-depth: 0
          persist-credentials: false

      # uv provides the uv-managed CPython 3.12+ that pyproject.toml and uv.lock pin; install.sh uses the same.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      # shfmt, the hooks' parser, is the shfmt-py wheel in the venv test.sh syncs.
      - name: Tests (the dev group of pyproject.toml, pinned in uv.lock)
        run: bash evals/test.sh -n auto

      - name: Install migration and idempotency
        run: bash .claude/hooks/fixtures/install.sh

      - name: Memory eval
        run: uv run --frozen --managed-python python evals/memory/run.py
