name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    name: Deterministic checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The upgrade fixture installs origin/main before this tree, so the full history is needed.
          fetch-depth: 0

      # Every check below is hermetic: no network, no API key, no model calls.
      - name: Repo conventions (routing, catalog, references, prompt budget)
        run: python3 .agent/tools/maintenance/crew-lint.py --budget

      - name: Ruff (version pinned in ruff.toml)
        run: bash evals/ruff.sh check .

      - name: Tests (tools, hooks, reviewer, install surface)
        run: |
          failed=0
          for t in evals/tools/test_*.py evals/reviewer/test_*.py; do
            echo "::group::$t"
            python3 "$t" || { echo "::error::$t failed"; failed=1; }
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Install migration and idempotency
        run: bash .claude/hooks/fixtures/install.sh

      - name: Memory eval
        run: python3 evals/memory/run.py

      - name: Shell syntax
        run: |
          bash -n install.sh
          for f in .claude/hooks/*.sh .claude/hooks/guard/*.sh .claude/hooks/lib/*.sh; do bash -n "$f"; done
          find .agent/tools -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
