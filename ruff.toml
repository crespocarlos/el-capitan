# Ruff is the Python linter for every package (.agent/tools, evals, .claude). The version is pinned
# here once (`required-version`); `evals/ruff.sh` reads it, locally (uvx) and in CI (pipx).
# Repository-specific rules (module cap, bootstrap imports, single owner) are crew-lint's.
required-version = "==0.17.4"
target-version = "py39"
line-length = 120
src = [".agent/tools", "evals"]

[lint]
# ANN20x: return annotations (today's rule); PLR0915 approximates the 50-line function limit by statements.
select = ["E", "F", "W", "I", "ANN201", "ANN202", "ANN205", "ANN206", "PLR0915", "C901", "B", "UP", "TID251", "RUF100"]

[lint.pylint]
max-statements = 50

[lint.mccabe]
max-complexity = 15

[lint.flake8-tidy-imports.banned-api]
# Generic module names collide on sys.path; a module is named <package>_<thing>.
"store".msg = "name the module <package>_store"
"units".msg = "name the module <package>_units"
"recall".msg = "name the module <package>_recall"
"maintenance".msg = "name the module <package>_maintenance"
"findings".msg = "name the module <package>_findings"
"layers".msg = "name the module <package>_layers"
"personas".msg = "name the module <package>_personas"
"report".msg = "name the module <package>_report"
# Import paths change only in the five identical <package>_bootstrap.py files ("Imports" in .agent/tools/AGENTS.md).
"sys.path".msg = "import <package>_bootstrap instead; only the bootstraps (and tests that load a module by path) set sys.path"

[lint.isort]
# The bootstrap sets the import path, so it is its own section, right after the standard library.
section-order = ["future", "standard-library", "bootstrap", "third-party", "first-party", "local-folder"]

[lint.isort.sections]
bootstrap = ["task_bootstrap", "review_bootstrap", "memory_bootstrap", "evals_bootstrap", "maintenance_bootstrap"]

# Baseline: existing violations per file, regenerated as packages are cleaned. Remove an entry when
# its file is fixed; never add one for new code. TID251 is not a violation: it marks the files that may
# set sys.path (the five bootstraps and the tests that load a module by path), each listed by name.
