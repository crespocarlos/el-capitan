# Ruff is the Python linter and formatter for every package (src/crew, evals, .claude). The version is pinned
# here once (`required-version`); `evals/ruff.sh` reads it, locally and in CI (uvx).
# Repository-specific rules (module cap, package edges, single owner) are crew-lint's.
required-version = "==0.17.4"
target-version = "py312"
# Run by the system python3 (macOS: 3.9), never the venv: the fail-closed spec guard
# (`check-task-spec-owner.sh`, the shell guard's task-files rule) loads these with `python3 -I`, and `agents-refresh.sh` runs install_blocks.
per-file-target-version = { "src/crew/core/task/task_status.py" = "py39", ".claude/hooks/lib/*.py" = "py39", ".claude/*.py" = "py39" }
line-length = 160
src = ["src", "evals"]

[lint]
# ANN: argument and return annotations; PLR0915 approximates the 50-line function limit by statements.
select = ["E", "F", "W", "I", "ANN001", "ANN201", "ANN202", "ANN205", "ANN206", "PLR0915", "C901", "B", "UP", "RUF100",
          "S", "SIM", "RET", "PERF", "PTH"]
# The tools run git, gh and the hooks by name with an argv list, never through a shell.
ignore = ["S603", "S607"]

[lint.pylint]
max-statements = 50

[lint.mccabe]
max-complexity = 15

[lint.isort]
known-first-party = ["crew"]
split-on-trailing-comma = false

# Baseline: existing violations per file. Remove an entry when its file is clean; never add one for new code.
[lint.per-file-ignores]
"evals/**" = ["S101"]  # a test asserts
".claude/hooks/lib/spec_guard.py" = ["B905", "E501", "PTH109", "PTH110", "PTH111", "PTH118", "PTH123", "PTH206"]
